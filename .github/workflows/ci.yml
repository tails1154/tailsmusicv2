name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check --output-format=github

      - name: Compile Python modules
        run: python -m compileall -q player.py tools.py wifi.py hotspot.py portal apps
